# Portable baseline (per target — `[build]` rustflags would leak
# `x86-64-v3` to aarch64 builds and fail).
#
# x86-64-v3 = Haswell (2013): AVX, AVX2, FMA, BMI1, BMI2, F16C, LZCNT, MOVBE,
# POPCNT, SSE 4.2. Supported by every modern AWS instance and every x86 CPU
# shipped in the last ~10 years.
#
# AVX-512 is NOT in v3 — it is opted into at function granularity via
# `#[target_feature(enable = "avx512f,...")]` plus runtime
# `is_x86_feature_detected!` dispatch (see `diploid/hmm_segment.rs::use_avx512`
# and `haploid/simd.rs`). One binary runs on AVX-512 hosts (c5/c6/c7i) AND
# non-AVX-512 hosts (c5a/c6a/c7a, m4/c4).
#
# To build for the local CPU (no portability), use:
#   RUSTFLAGS="-C target-cpu=native" cargo build --release
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v3"]

# aarch64 Linux uses the generic ARMv8-A baseline, NOT a Graviton-specific
# target-cpu. This keeps the imputation output byte-identical across architectures
# (the rc6 release is built this way and checked byte-identical to x86): a
# microarch target-cpu like neoverse-n1 can change FP/vector codegen and diverge
# from the x86 result, and ARM has no documented cross-target-cpu output invariant
# the way the x86 HMM kernels do. generic also runs on any ARMv8-A core (Graviton1+).
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=generic"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1"]

# Static musl build — fully self-contained ELF that runs on any glibc/musl
# Linux without a runtime libc dependency. Produces a single portable binary
# for distribution. Requires `musl-tools` (apt) for the linker. Build with:
#   cargo build --release --target x86_64-unknown-linux-musl
[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
# relocation-model=static: a plain static executable. Without it the ubuntu-22.04 musl-gcc
# (1.2.2) linked the static-pie request as a dynamic PIE that asks for /lib/ld-musl-x86_64.so.1
# and crashes on start where that loader is missing (the 2.0.0-rc6 CI build).
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+crt-static", "-C", "relocation-model=static"]

# aarch64 musl static build — the ARM counterpart of the x86_64 entry above.
# Same generic ARMv8-A baseline as the aarch64 glibc target (see note there);
# built natively on an ARM host (the release workflow uses a GitHub-hosted
# ubuntu-22.04-arm runner) with `musl-tools`, which provides the aarch64 `musl-gcc`
# wrapper.
[target.aarch64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = ["-C", "target-cpu=generic", "-C", "target-feature=+crt-static"]
